trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
    sudo apt-get install -y nodejs
    node --version
  displayName: 'Install Node.js 20'

- script: npm install --legacy-peer-deps
  displayName: 'Install dependencies'
  env:
    NODE_ENV: development

- script: npm run build
  displayName: 'Build Next.js app'
  env:
    NODE_ENV: production
    NODE_TLS_REJECT_UNAUTHORIZED: '0'

- script: |
    echo "=== CSS files from build ==="
    ls .next/static/css/
    echo "=== Build OK ==="
  displayName: 'Verify build CSS'

- script: |
    mkdir deploy
    cp -r .next deploy/
    cp -r public deploy/
    cp -r messages deploy/
    cp -r i18n deploy/
    cp -r lib deploy/
    cp next.config.js deploy/
    cp package.json deploy/
    cp package-lock.json deploy/ 2>/dev/null || true
    # Write a startup script that handles PORT correctly
    cat > deploy/start.sh << 'EOF'
#!/bin/bash
cd /home/site/wwwroot
exec node_modules/.bin/next start -p ${PORT:-8080}
EOF
    chmod +x deploy/start.sh
    echo "Installing production dependencies..."
    cd deploy && npm install --legacy-peer-deps --omit=dev
    echo "=== CSS still present after install ==="
    ls .next/static/css/
  displayName: 'Prepare deployment package'

- script: |
    cd deploy
    zip -r "$(Build.ArtifactStagingDirectory)/frontend.zip" . \
      --exclude "*.git*" --exclude "node_modules/.cache/*"
    echo "=== CSS files in zip ==="
    unzip -l "$(Build.ArtifactStagingDirectory)/frontend.zip" | grep "\.css"
    echo "=== Zip size ==="
    du -sh "$(Build.ArtifactStagingDirectory)/frontend.zip"
  displayName: 'Create and verify deployment zip'

- task: AzureCLI@2
  inputs:
    azureSubscription: 'Azure-Service-Connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      RESOURCE_GROUP=$(az webapp list --query "[?name=='rg-opulanz-frontend'].resourceGroup | [0]" -o tsv)
      echo "Resource group: $RESOURCE_GROUP"
      az webapp config appsettings set \
        --name rg-opulanz-frontend \
        --resource-group "$RESOURCE_GROUP" \
        --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false
      az webapp config set \
        --name rg-opulanz-frontend \
        --resource-group "$RESOURCE_GROUP" \
        --startup-file 'bash start.sh'
      az webapp deployment source config-zip \
        --name rg-opulanz-frontend \
        --resource-group "$RESOURCE_GROUP" \
        --src "$(Build.ArtifactStagingDirectory)/frontend.zip"
      echo "Deployment complete"
  displayName: 'Deploy to Azure App Service'
