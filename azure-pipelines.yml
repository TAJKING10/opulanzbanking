trigger:
- DocuSignWordfiles

pool:
  vmImage: ubuntu-latest

variables:
  VERCEL_PROJECT_ID: 'prj_3NJ50azpNT5OKeTof6mPr18c7fi0'
  VERCEL_ORG_ID: 'team_fhA85kClq1piD12QCIwYK8Qq'

steps:
- checkout: self

- script: |
    npm install -g vercel
  displayName: 'Install Vercel CLI'

- script: |
    vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
  displayName: 'Pull Vercel Preview Settings'
  env:
    VERCEL_ORG_ID: $(VERCEL_ORG_ID)
    VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)
    VERCEL_TOKEN: $(VERCEL_TOKEN)

- script: |
    vercel build --token=$VERCEL_TOKEN
  displayName: 'Build Vercel Preview'
  env:
    VERCEL_ORG_ID: $(VERCEL_ORG_ID)
    VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)
    VERCEL_TOKEN: $(VERCEL_TOKEN)

- script: |
    vercel deploy --prebuilt --token=$VERCEL_TOKEN
  displayName: 'Deploy to Vercel Preview'
  env:
    VERCEL_ORG_ID: $(VERCEL_ORG_ID)
    VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)
    VERCEL_TOKEN: $(VERCEL_TOKEN)