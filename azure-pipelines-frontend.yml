trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: frontend-env-vars

steps:
# 1️⃣ Use Node.js 20
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Use Node.js 20'

# 2️⃣ Install dependencies
- script: npm ci
  displayName: 'Install dependencies'

# 3️⃣ Build Next.js (reads .env.production automatically)
- script: npm run build
  displayName: 'Build Next.js app'
  env:
    NODE_ENV: production
    NEXT_PUBLIC_API_URL: $(NEXT_PUBLIC_API_URL)
    NEXT_PUBLIC_BASE_URL: $(NEXT_PUBLIC_BASE_URL)
    NEXT_PUBLIC_GOOGLE_CLIENT_ID: $(NEXT_PUBLIC_GOOGLE_CLIENT_ID)
    NEXT_PUBLIC_PAYPAL_CLIENT_ID: $(NEXT_PUBLIC_PAYPAL_CLIENT_ID)
    NEXT_PUBLIC_TAWK_PROPERTY_ID: $(NEXT_PUBLIC_TAWK_PROPERTY_ID)
    NEXT_PUBLIC_TAWK_WIDGET_ID: $(NEXT_PUBLIC_TAWK_WIDGET_ID)

# 4️⃣ Copy public + static assets into standalone output
- script: |
    cp -r public .next/standalone/public
    cp -r .next/static .next/standalone/.next/static
    echo "✅ Static assets copied into standalone output"
  displayName: 'Copy static assets to standalone'

# 5️⃣ Archive the standalone output for deployment
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '.next/standalone'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'
    replaceExistingArchive: true
  displayName: 'Archive standalone build'

# 6️⃣ Deploy to Azure App Service
- task: AzureWebApp@1
  inputs:
    azureSubscription: 'Azure-Service-Connection'
    appName: 'rg-opulanz-frontend'
    package: '$(Build.ArtifactStagingDirectory)/frontend.zip'
    startUpCommand: 'node server.js'
  displayName: 'Deploy to App Service'
