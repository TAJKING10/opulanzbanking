trigger:
  branches:
    include:
      - main
      - backend

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: backend-env-vars

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Use Node.js 20'

  - script: |
      cd backend
      npm install --no-audit --no-fund
    displayName: 'Install backend dependencies'

  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: '$(System.DefaultWorkingDirectory)/backend'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/backend-$(Build.BuildId).zip'
      replaceExistingArchive: true

  - task: AzureAppServiceSettings@1
    displayName: 'Configure App Service Settings'
    inputs:
      azureSubscription: 'Azure-Service-Connection'
      appName: 'rg-opulanz-backend'
      appSettings: |
        [
          { "name": "PORT", "value": "$(PORT)" },
          { "name": "NODE_ENV", "value": "$(NODE_ENV)" },
          { "name": "DB_HOST", "value": "$(DB_HOST)" },
          { "name": "DB_USER", "value": "$(DB_USER)" },
          { "name": "DB_PASSWORD", "value": "$(DB_PASSWORD)" },
          { "name": "DB_NAME", "value": "$(DB_NAME)" },
          { "name": "DB_PORT", "value": "$(DB_PORT)" },
          { "name": "FRONTEND_URL", "value": "$(FRONTEND_URL)" },
          { "name": "NARVI_API_URL", "value": "$(NARVI_API_URL)" },
          { "name": "NARVI_API_KEY_ID", "value": "$(NARVI_API_KEY_ID)" },
          { "name": "EMAIL_USER", "value": "$(EMAIL_USER)" },
          { "name": "EMAIL_PASS", "value": "$(EMAIL_PASS)" },
          { "name": "INBOX_USER", "value": "contact@opulanz.com" },
          { "name": "IMAP_HOST", "value": "imap.mail.ovh.net" },
          { "name": "ADMIN_PASSWORD", "value": "Opulanz2025" },
          { "name": "AZURE_STORAGE_CONTAINER_NAME", "value": "opulanz-documents" }
        ]

  - task: AzureWebApp@1
    displayName: 'Deploy to Azure App Service'
    inputs:
      azureSubscription: 'Azure-Service-Connection'
      appName: 'rg-opulanz-backend'
      package: '$(Build.ArtifactStagingDirectory)/backend-$(Build.BuildId).zip'
      appSettings: '-INBOX_PASS "$(INBOX_PASS)"'