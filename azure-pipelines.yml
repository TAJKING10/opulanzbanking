trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- script: |
    curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
    sudo apt-get install -y nodejs
    node --version
    npm --version
  displayName: 'Install Node.js 20'

- script: npm install --legacy-peer-deps
  displayName: 'Install dependencies'
  env:
    NODE_ENV: development

- script: npm run build
  displayName: 'Build Next.js app'
  env:
    NODE_ENV: production
    NODE_TLS_REJECT_UNAUTHORIZED: '0'

- script: |
    cp -r public .next/standalone/public
    cp -r .next/static .next/standalone/.next/static
    cp web.config .next/standalone/web.config
    echo "=== Verifying deployment contents ==="
    ls -la .next/standalone/
    ls -la .next/standalone/.next/
    ls -la .next/standalone/.next/static/css/ | head -5
    echo "=== CSS files present ==="
  displayName: 'Copy static assets and verify'

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '.next/standalone'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'
    replaceExistingArchive: true
  displayName: 'Archive standalone build'

- task: AzureCLI@2
  inputs:
    azureSubscription: 'Azure-Service-Connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      RESOURCE_GROUP=$(az webapp list --query "[?name=='rg-opulanz-frontend'].resourceGroup | [0]" -o tsv)
      echo "Resource group: $RESOURCE_GROUP"
      az webapp config appsettings set \
        --name rg-opulanz-frontend \
        --resource-group "$RESOURCE_GROUP" \
        --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false
      az webapp config set \
        --name rg-opulanz-frontend \
        --resource-group "$RESOURCE_GROUP" \
        --startup-file 'node server.js'
      az webapp deploy \
        --name rg-opulanz-frontend \
        --resource-group "$RESOURCE_GROUP" \
        --src-path "$(Build.ArtifactStagingDirectory)/frontend.zip" \
        --type zip \
        --clean true \
        --async false
      echo "Deployment complete"
  displayName: 'Deploy to Azure App Service (clean)'
