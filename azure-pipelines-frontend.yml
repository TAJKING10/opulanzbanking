trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
# 1️⃣ Use Node.js 20
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Use Node.js 20'

# 2️⃣ Install dependencies
- script: npm ci
  displayName: 'Install dependencies'

# 3️⃣ Build Next.js in standalone mode (required for App Service node server.js deployment)
- script: npm run build
  displayName: 'Build Next.js app'
  env:
    NODE_ENV: production
    NEXT_OUTPUT: standalone
    NEXT_PUBLIC_API_URL: https://rg-opulanz-backend-ffa3bgfze4a4g6gf.canadacentral-01.azurewebsites.net

# 4️⃣ Copy public + static assets into standalone output
- script: |
    cp -r public .next/standalone/public
    cp -r .next/static .next/standalone/.next/static
    cp web.config .next/standalone/web.config
    echo "✅ Static assets and web.config copied into standalone output"
  displayName: 'Copy static assets to standalone'

# 5️⃣ Archive the standalone output for deployment
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '.next/standalone'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'
    replaceExistingArchive: true
  displayName: 'Archive standalone build'

# 6️⃣ Deploy to Azure App Service
- task: AzureWebApp@1
  inputs:
    azureSubscription: 'Azure-Service-Connection'
    appName: 'rg-opulanz-frontend'
    package: '$(Build.ArtifactStagingDirectory)/frontend.zip'
    startUpCommand: 'node server.js'
  displayName: 'Deploy to App Service'
